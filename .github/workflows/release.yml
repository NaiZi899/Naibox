name: Release

# 打 v* tag 时自动构建多平台二进制并挂到 GitHub Release。
#
# # 为什么在 CI 里构建而不是本机编译后上传
#
#   1. 干净环境 —— 产物不含作者本机的路径 / 用户名 / go module 缓存路径
#      （实测：不加 -trimpath 时二进制里会有 C:/Users/<name>/go/pkg/mod/...）
#   2. 可复现 —— 任何人 fork 后打 tag 都能得到同构产物
#   3. 交叉编译 —— 一台机器出五平台产物，无需本地装多套工具链
#   4. **唯一来源** —— 见下
#
# # 为什么强调"唯一来源"（v1.7.0 踩过的坑）
#
# v1.7.0 的 Release 上有 **7 个**资产，但实际只有 5 个平台 ——
# 因为两套命名并存：
#
#   CI 编的：  Naibox-server-windows-amd64.zip
#              Naibox-server-linux-amd64.tar.gz
#   本机编的： Naibox-server-v1.7.0-windows-amd64.zip
#              Naibox-server-v1.7.0-linux-amd64.zip
#              （还有 linux-arm64 / darwin-amd64 / darwin-arm64）
#
# 其中 windows-amd64 与 linux-amd64 **各重复了一次**，且命名风格还不一致
# （一个带版本号、一个不带；一个用 tar.gz、一个用 zip）。
# 下载的人分不清该拿哪个，两个文件的内容也可能来自不同 commit。
#
# 所以现在的约定是：
#
#   **所有平台都由本 workflow 出，本机不再手工上传任何产物。**
#   命名统一为 `Naibox-server-<goos>-<goarch>.<zip|tar.gz>`（不带版本号 ——
#   版本信息在 Release tag 与 zip 内的二进制里，文件名带版本号只会让
#   "同一个 tag 重发"产生两个名字）。桌面壳沿用同一套形状：
#   `NaiBox-windows-amd64.zip`（它只有 windows-amd64 一种）。
#
# # 产物
#
#   Naibox-server-windows-amd64.zip      含 exe + config.example.json + start.bat
#   Naibox-server-linux-amd64.tar.gz     含可执行文件 + config.example.json
#   Naibox-server-linux-arm64.tar.gz
#   Naibox-server-darwin-amd64.tar.gz
#   Naibox-server-darwin-arm64.tar.gz
#   NaiBox-windows-amd64.zip     含 NaiBox.exe（GUI 子系统，
#                                          无控制台窗）+ config.example.json + README.txt
#   SHA256SUMS.txt                        上面六者的校验和（合并成一份）
#
# ⚠ 新增产物名时必须同步改文件末尾 "Prune stale assets" 里那道白名单正则，
#   否则新产物会被自己的清理步骤当成历史残留删掉（判据就是"名字不符合规范"，
#   而它只认识写死在正则里的那几个名字）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # 允许手动触发（用于测试 workflow 本身）

permissions:
  contents: write         # 需要写 Release

jobs:
  # 先过质量门禁：坏的代码不该被做成 Release 产物。
  #
  # 单独一个 job（而不是塞进 matrix）的理由：让它在**所有**平台构建之前
  # 跑一次就够。放进 matrix 会跑五遍（浪费额度），且失败的信号被埋在
  # 五个 job 的输出里。
  verify:
    name: verify before packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # 与 ci.yml 保持一致（不跑 -race：那一步在 ci.yml 里是 advisory）。
      - name: Build / vet / test
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # archive 只分两种：Windows 用 zip（双击即用），其余用 tar.gz。
          # 不按平台逐个写 zip —— 那是无谓的差异，且让"该怎么解压"
          # 变成一件要查文档的事。
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'          # 纯静态，产物可丢到任意同级系统上跑
        run: |
          # -trimpath 必须保留：去掉本机绝对路径与 module 缓存路径
          # -s -w 去掉符号表与 DWARF，体积约减小 30%
          go build -trimpath -ldflags="-s -w" \
            -o "dist/Naibox-server${{ matrix.ext }}" ./cmd/server

      - name: Assemble package
        run: |
          set -e
          PKG="Naibox-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "pkg/$PKG"
          cp "dist/Naibox-server${{ matrix.ext }}" "pkg/$PKG/"
          cp config.example.json "pkg/$PKG/"
          # Windows 包额外带上 start.bat（双击即用）。
          # 其它平台不带：那些平台的用户习惯自己写启动脚本，
          # 塞一个 .sh 进去反而要处理执行权限。
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp start.bat "pkg/$PKG/"
          fi
          cd pkg
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "../$PKG.zip" "$PKG"
          else
            tar czf "../$PKG.tar.gz" "$PKG"
          fi
          cd ..
          echo "--- 产物 ---"
          ls -la

      - name: Checksums
        run: |
          # 每个 matrix job 只产出自己那一种归档（见上面的 archive 字段），
          # 所以这里不能同时 glob 两种扩展名 —— 缺的那种会被 bash 当成
          # "No such file or directory" 直接失败。
          # 改用 find 只收集实际存在的文件。
          find . -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) -printf '%f\n' \
            | sort | xargs sha256sum > "SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt"
          cat "SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.zip
            *.tar.gz
            SHA256SUMS-*.txt

  # 桌面壳（Windows GUI exe）单独一个 job，不塞进上面的 matrix：
  #
  #   1. 它只有 windows-amd64 一种形态 —— 其余四个平台会变成"跑了但跟桌面无关"
  #      的空转，还会各自产一份无意义的校验和。
  #   2. 打包内容不同：桌面壳不带 start.bat（那是给命令行服务端双击用的），
  #      带一份 README.txt 说明首次启动去哪个端口。
  #   3. -H=windowsgui 是 Windows 链接器开关，跟交叉编译矩阵混在一起会让
  #      "这个平台到底该不该加这个 flag"变成要看 condition 才能回答的问题。
  #   4. 图标与 DPI 清单要现场派生（代码画 ICO → rsrc 打成 .syso），比别的
  #      job 多两步前置；仓库里没有任何 .ico/.png 可捡。
  desktop:
    name: build desktop windows-amd64
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # 图标与 DPI 清单是**资源**：仓库里没有 .ico/.png（图形是 internal/icon
      # 的代码画的），必须先落成 ICO，再由 rsrc 打成 cmd/desktop/rsrc.syso
      # 才会被链接进 PE 的 .rsrc 段。缺这一步不会让构建失败，产出的 exe 只是
      # 无图标、无 DPI 声明 —— 那种问题在 CI 日志里看不见，要等用户装了才反馈。
      - name: Generate icon (pure Go)
        run: |
          go run ./tools/genicon -out .build/icon/app.ico
          ls -la .build/icon

      - name: Generate Windows resource (.syso)
        env:
          # 首次要下载 rsrc 模块。goproxy.cn 优先（国内链路），再落回官方代理。
          GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
        run: |
          go run github.com/akavel/rsrc@v0.10.2 -arch amd64 \
            -ico .build/icon/app.ico \
            -manifest assets/icon/app.manifest \
            -o cmd/desktop/rsrc.syso
          ls -la cmd/desktop

      - name: Build desktop shell
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          # -H=windowsgui：把 PE 子系统设成 GUI，双击不弹黑色控制台窗口。
          # 代价是 stdout/stderr 不再挂控制台，日志得走文件/界面。
          #
          # -X 注入版本：desktop.Version 的默认值是开发期占位，真正的版本
          # 来自 tag。不注入的话，"v1.1 的 Release"里跑着 -version 会打印
          # 0.1.0 —— 用户据此判断升级有没有生效时会被误导。
          # `${GITHUB_REF_NAME#v}` 去掉 v 前缀：tag 是 v1.1，版本号要 1.1。
          go build -trimpath \
            -ldflags="-s -w -H=windowsgui -X github.com/NaiZi899/Naibox/internal/desktop.Version=${GITHUB_REF_NAME#v}" \
            -o "dist/NaiBox.exe" ./cmd/desktop
          ls -la dist

          # 立刻验证注入真的生效。
          #
          # 为什么不直接跑 dist/NaiBox.exe -version：GUI 子系统的 exe 在
          # 这个 ubuntu runner 上根本跑不起来，而且它的 stdout 不挂控制台。
          # 所以交叉编一个**同一条 -X** 的 linux 版来跑 —— 验证的是同一个
          # 链接参数路径与同一个值，而 -X 路径写错时 go build 不报错（静默
          # 不生效），正是需要这一步的原因。
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-X github.com/NaiZi899/Naibox/internal/desktop.Version=${GITHUB_REF_NAME#v}" \
            -o /tmp/vercheck ./cmd/desktop
          echo "--- 注入后的版本 ---"
          /tmp/vercheck -version
          /tmp/vercheck -version | grep -q "${GITHUB_REF_NAME#v}" || {
            echo "✗ 版本注入未生效：-X 路径可能写错（go build 对此不报错）"; exit 1; }

      # 光看 go build 返回 0 不够：-H=windowsgui 写错成别的形式、或被后面的
      # 链接参数覆盖，编译器都不会报错；.syso 没被链接进去同样不报错。
      # 用 tools/genicon -verify 读 PE 头把两件事都变成断言：
      #   OPTIONAL_HEADER.Subsystem == 2（GUI）且资源目录非空（图标 + manifest 在）。
      - name: Verify PE header (GUI subsystem + resources present)
        run: go run ./tools/genicon -verify dist/NaiBox.exe

      - name: Assemble package
        run: |
          set -e
          PKG="NaiBox-windows-amd64"
          mkdir -p "pkg/$PKG"
          cp dist/NaiBox.exe "pkg/$PKG/"
          cp config.example.json "pkg/$PKG/"
          # README 直接写在这里，不引外部文件：桌面壳的说明只有这几行，
          # 单独维护一个 docs/*.md 会让它和 zip 里的内容不同步。
          cat > "pkg/$PKG/README.txt" <<'EOF'
          omni2api 桌面壳（Windows amd64）
          ================================

          双击 NaiBox.exe 即可启动，无控制台窗口。
          首次启动会读取同目录的 config.example.json；把它复制成 config.json
          后按需修改（端口、上游、api_key），再重启生效。

          网关默认监听 127.0.0.1:7863，启动后浏览器打开：
              http://127.0.0.1:7863/healthz

          日志/配置目录：见界面里的「打开数据目录」，或 %APPDATA%\omni2api。
          卸载：直接删除本目录，不写注册表、不装服务。

          校验和见 Release 页的 SHA256SUMS.txt。
          EOF
          cd pkg
          zip -r "../$PKG.zip" "$PKG"
          cd ..
          echo "--- 产物 ---"
          ls -la

      - name: Checksums
        run: |
          find . -maxdepth 1 -name '*.zip' -printf '%f\n' \
            | sort | xargs sha256sum > "SHA256SUMS-desktop-windows-amd64.txt"
          cat "SHA256SUMS-desktop-windows-amd64.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-desktop-windows-amd64
          path: |
            *.zip
            SHA256SUMS-*.txt

  release:
    name: publish release assets
    needs: [build, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # fetch-depth: 0 是为了消除一处**依赖实现细节**的隐患。
      #
      # 下面用 `gh release create --notes-from-tag` 取 Release 说明，它读的是
      # **本地 git 的 annotated tag 对象**（tag message 存在 tag 对象里，
      # 不在 commit 里）。
      #
      # 实测：显式 fetch 了 tag ref 的浅克隆能读到 message（1384 字节）；
      # 但 actions/checkout 在 tag 事件下的 fetch 策略依版本而变 —— 有的版本
      # 只取 commit SHA 再 detached checkout，tag 对象就不在本地。那时
      # `--notes-from-tag` 会拿到空说明或直接报错，而失败点在"发布"这一步，
      # tag 已经推出去了。
      #
      # 拉全历史换取"一定读得到"，代价只是这个仓库的 clone 时间。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd artifacts
          # 把各 matrix 的校验和合成一份；文件名不写死，避免加平台时漏改
          grep -h . SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          echo "--- artifacts 内容 ---"
          ls -la
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release 可能已被人工创建（本仓库习惯：先建带说明的 Release，
          # 再补资产）。存在就 upload --clobber，不存在就 create。
          #
          # ⚠ `--clobber` 只覆盖**同名**资产。若历史上存在另一套命名的
          # 资产（v1.7.0 就同时有带版本号与不带版本号的两套），
          # 它们不会被清掉 —— 那种历史残留由下一步处理。
          cd artifacts
          ASSETS=$(find . -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' -o -name 'SHA256SUMS.txt' \) -printf '%f\n' | sort)
          echo "将上传："
          echo "$ASSETS"
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，上传资产（覆盖同名）"
            echo "$ASSETS" | xargs gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Release $TAG 不存在，创建"
            # 自证：tag message 非空。
            #
            # 一条空白的 Release 说明比没有更糟 —— 下载者会以为"这版没改动"。
            # lightweight tag 上 gh 会回落到 commit message，但两者都可能为空
            # （例如 `git tag v2.0` 后直接 push）。在这里断掉，代价是一次失败
            # 的 job；漏过去则是一份无信息的发布页。
            if ! git tag -l --format='%(contents)' "$TAG" | grep -q .; then
              echo "✗ tag $TAG 没有 message —— Release 说明会为空。"
              echo "  先写 message 再重发：git tag -f -a $TAG -F <notes-file> && git push -f origin $TAG"
              exit 1
            fi
            # 标题格式：`NaiBox <tag>`，**只这两段**。
            #
            # 标题该是**可检索的标识**，说明留在 notes 里 —— 不要附加主题描述
            # （曾出现 `— 上游 4 个 → 10 个 + …` 这种）。
            #
            # Release 说明来自 **annotated tag 的 message**，但**不能**直接用
            # `--notes-from-tag`：gh 明确拒绝它与 `--repo` 同时出现
            # （`using --notes-from-tag with --repo is not supported`，exit 123）。
            # 1.1 那次成功是因为当时还没加 `--repo`；加上之后这条路径就成了
            # "构建全绿、发布必红"的形状，且失败点在最后一步。
            #
            # 所以改成自己把 tag message 落成文件再喂 `--notes-file`：
            # 语义与 `--notes-from-tag` 等价（都读 tag 对象里的 message），
            # 又不受那条互斥限制。空的 message 上面已经拦过一次，这里再判一次
            # 文件非空，防止 `mktemp` 成功但内容为空时把空说明发出去。
            NOTES="$(mktemp)"
            git tag -l --format='%(contents)' "$TAG" > "$NOTES"
            if [ ! -s "$NOTES" ]; then
              echo "✗ 取出的 tag message 为空，拒绝创建无说明的 Release。"
              exit 1
            fi
            echo "$ASSETS" | xargs gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NaiBox $TAG" \
              --notes-file "$NOTES"
          fi

      - name: Prune stale assets
        env:
          GH_TOKEN: ${{ github.token }}
        # 删掉"不该由本 workflow 产出"的资产残留。
        #
        # # 为什么要这一步（v1.7.0 的教训）
        #
        # 上一版的产物来自两处：本机手工编的 5 个（文件名带版本号）
        # + CI 的 2 个。于是 Release 上有 7 个资产、两个平台重复。
        # 那些手工产物在后续 tag 上不会重现，但它们在 v1.7.0 上会一直
        # 留着，让下载的人分不清哪个才是这个 tag 的产物。
        #
        # 判据：资产名必须匹配本 workflow 的命名规范。
        #
        # ⚠ 这条正则是**唯一的放行名单**，新增产物必须同步加进来，
        #   否则上面刚上传的新资产会在这里被当成历史残留删掉
        #   （同样的形状在 v1.7.0 之后已经坑过一次：新产物传上去、
        #   下一步自己删掉，Release 页上看着就像"构建没产出"）。
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          echo "检查 $TAG 上的资产是否符合命名规范…"
          # 允许的名字：
          #   Naibox-server-<windows|linux|darwin>-<amd64|arm64>.<zip|tar.gz>
          #   NaiBox-windows-amd64.zip
          #   SHA256SUMS.txt（单独一条 grep -v，见下）
          STALE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' \
            | grep -Ev '^(Naibox-server-(windows|linux|darwin)-(amd64|arm64)\.(zip|tar\.gz)|NaiBox-windows-amd64\.zip)$' \
            | grep -v '^SHA256SUMS\.txt$' || true)
          if [ -z "$STALE" ]; then
            echo "没有残留资产。"
            exit 0
          fi
          echo "发现命名不符的资产（可能来自旧的手工上传）："
          echo "$STALE"
          echo "$STALE" | while read -r name; do
            [ -z "$name" ] && continue
            echo "删除 $name"
            gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
          done
          echo "清理完成。剩余资产："
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
