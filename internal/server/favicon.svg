<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NaiBox">
  <!--
    NaiBox 站点图标（浏览器标签页 / 控制台顶栏）。

    ⚠ 与 assets/icon/app.svg、internal/icon/icon.go 是**同一套几何**：
    底板 3..61 圆角 15，字母 N 左竖 x=21 / 右竖 x=43 / 上 y=16 / 下 y=48，
    笔画直径 7.5。改图形时三处一起改 —— 否则"标签页是旧标、exe 是新标"
    这种不一致会长期存在（没人会主动去比对）。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8dcf7"/>
      <stop offset="1" stop-color="#6fbfef"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bg)"/>
  <path d="M21 48 V16 L43 48 V16" fill="none" stroke="#0d4a75" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
