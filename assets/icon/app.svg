<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NaiBox">
  <!--
    NaiBox 图标的设计源（矢量规格）。

    ⚠ 改图形要**同时改两处**：本文件与 internal/icon/icon.go。
    真正被渲染的是 Go 代码（构建期生成 ICO、运行时生成托盘图标），
    这个 SVG 是给人看的规格与几何参照 —— 两边的数字必须一一对上，
    否则"看 SVG 觉得对、跑起来不对"这种偏差极难查。

    几何（64 栅格，与 icon.go 的常量同名）：
      底板  x 3..61, y 3..61, 圆角 15
      N     左竖 x=21, 右竖 x=43, 上 y=16, 下 y=48, 笔画直径 7.5

    配色：
      底板  #a8dcf7 → #6fbfef（自上而下）
      N     #0d4a75

    N 用深蓝而不是白色：白字压在浅蓝底上对比度只有约 1.3:1，
    16px 的托盘图标里会糊成一片；深蓝对浅蓝约 6.5:1，小尺寸仍清晰。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8dcf7"/>
      <stop offset="1" stop-color="#6fbfef"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bg)"/>
  <path d="M21 48 V16 L43 48 V16" fill="none" stroke="#0d4a75" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
